<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f8fafc; background: radial-gradient(ellipse at 50% 0%, #243b63 0, #101827 65%); }
    main { max-width: 42rem; padding: 3rem 2rem; text-align: center; }
    .badge { display: inline-block; padding: .45rem .8rem; border: 1px solid #4b6287; border-radius: 999px; color: #bfdbfe; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 1.3rem 0 .7rem; font-size: clamp(3rem, 10vw, 5.5rem); line-height: 1; letter-spacing: -.06em; }
    p { margin: 0; color: #cbd5e1; font-size: clamp(1rem, 3vw, 1.25rem); line-height: 1.7; }
    .dot { color: #60a5fa; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Your page is live</span>
    <h1>Hello, world<span class="dot">!</span></h1>
    <p>A little corner of the internet, made with plain HTML and CSS.</p>
  </main>
</body>
</html>
